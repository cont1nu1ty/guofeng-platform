paths:
  /admin/bootstrap:
    get:
      operationId: adminBootstrap
      summary: Authorized configuration and permissions without business arrays
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
                  roles:
                    type: array
                    items:
                      type: string
                  reviewFlow:
                    type: object
                  platformConfig:
                    type: object
                  homepageConfig:
                    type: object
        default:
          $ref: '#/components/responses/Error'
  /admin/records/{collection}:
    get:
      operationId: adminRecordsPage
      summary: SQL-scoped business list with module read authorization
      description: The UI uses bounded reads and compact command responses. Page filters
        query all matching rows; local UI categories may additionally filter the current
        page. Submission Chinese status labels are mapped to persisted states. Activity
        rows expose counts; registrations have a separate paginated endpoint. Audit
        rows exclude private recitation/family-promise content.
      parameters:
      - name: collection
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: q
        in: query
        schema:
          type: string
          maxLength: 150
      - name: status
        in: query
        schema:
          type: string
      - name: region
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessRecordPage'
        default:
          $ref: '#/components/responses/Error'
  /admin/records/{collection}/{id}:
    get:
      operationId: adminRecordDetail
      summary: Authorized domain detail
      parameters:
      - name: collection
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
  /admin/collection-candidates:
    get:
      operationId: collectionCandidates
      summary: Search published selected works for collection import; collections:write
        required
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: region
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                  limit:
                    type: integer
        default:
          $ref: '#/components/responses/Error'
  /admin/activities/{id}/registrations:
    get:
      operationId: activityRegistrationPage
      summary: SQL-paginated registered attendees in authorized activity
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ''
          - checked
          - pending
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessRecordPage'
        default:
          $ref: '#/components/responses/Error'
  /admin/statistics:
    get:
      operationId: adminStatistics
      summary: Database aggregates within analytics:read and region scope
      parameters:
      - name: region
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseStatistics'
        default:
          $ref: '#/components/responses/Error'
  /admin/exports:
    get:
      operationId: listExportJobs
      summary: Current account export jobs; snapshots are not returned
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExportJob'
                  total:
                    type: integer
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createExportJob
      summary: Freeze an authorized snapshot then enqueue a durable export
      description: Reports require analytics:export; collections require collections:export;
        submission CSV requires submissions:export; other CSV requires jobs:export
        plus module read. One CSV request is limited to 5000 records; 1-20 collections;
        PDF/DOCX documents to 500000 characters. Database snapshot contains the actual
        authorized records, not only a timestamp.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                properties:
                  id:
                    type: string
                  status:
                    enum:
                    - queued
        default:
          $ref: '#/components/responses/Error'
  /admin/exports/{id}/{action}:
    post:
      operationId: controlExportJob
      summary: Retry a failed job or cancel a queued/running/failed job
      description: Revalidates current export permission and frozen authorized scope.
        Generation fencing prevents cancelled workers from publishing results.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
          - retry
          - cancel
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
  /admin/exports/{id}/download:
    get:
      operationId: downloadExport
      summary: Issue a short-lived private URL after owner, permission and scope recheck
      description: Non-report exports expire after 7 days. Archived report files have
        no application expiry. Existing signed URLs remain valid until their short
        expiry; no claim to recall downloaded copies. Every request is audited.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedDownload'
        default:
          $ref: '#/components/responses/Error'
  /me/delivery-preferences:
    get:
      operationId: deliveryPreferences
      summary: Own digest, draft and report preferences
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryPreferences'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateDeliveryPreferences
      summary: Save preferences executed by durable scheduling
      description: Digests/reports default off. Draft notifications are gated by the
        platform draftNotice switch. Daily/weekly digests count prior complete periods;
        monthly/quarterly/yearly reports begin at a period boundary after enabling.
        All periods use Asia/Shanghai. Reports additionally require analytics:export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryPreferences'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryPreferences'
        default:
          $ref: '#/components/responses/Error'
  /engagement/events:
    post:
      operationId: recordEngagement
      summary: Record a signed-in view or share intent for published content
      description: Deduplicates by account/content/action/Beijing calendar day. No
        anonymous fingerprint or IP is stored. Share intent is not evidence of successful
        forwarding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kind
              - targetId
              - action
              properties:
                kind:
                  type: string
                  enum:
                  - media
                  - submission
                  - content
                  - collection
                targetId:
                  type: string
                  maxLength: 64
                action:
                  type: string
                  enum:
                  - view
                  - share_intent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded:
                    type: boolean
                  metricVersion:
                    type: string
        default:
          $ref: '#/components/responses/Error'
components:
  schemas:
    BusinessRecordPage:
      type: object
      required:
      - items
      - total
      - page
      - pageSize
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
          minimum: 0
        page:
          type: integer
        pageSize:
          type: integer
        asOf:
          type: string
          format: date-time
    DatabaseStatistics:
      type: object
      properties:
        totals:
          type: object
          properties:
            submissions:
              type: integer
            participants:
              type: integer
            reviewing:
              type: integer
            selected:
              type: integer
        regions:
          type: array
          items:
            type: object
        trend:
          type: array
          maxItems: 90
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              submitted:
                type: integer
        engagement:
          type: object
          properties:
            signedInViews:
              type: integer
            shareIntents:
              type: integer
        asOf:
          type: string
          format: date-time
        definition:
          type: string
        metricVersion:
          type: string
        engagementDefinition:
          type: string
    ExportRequest:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - csv
          - collection
          - report
        collection:
          type: string
        ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
        format:
          type: string
          enum:
          - pdf
          - docx
        q:
          type: string
        status:
          type: string
        region:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Exclusive Asia/Shanghai date boundary
    ExportJob:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
        attempts:
          type: integer
        errorCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        request:
          $ref: '#/components/schemas/ExportRequest'
        result:
          type: object
          properties:
            fileId:
              type: string
            name:
              type: string
            mimeType:
              type: string
            sha256:
              type: string
            size:
              type: integer
    AuthorizedDownload:
      type: object
      properties:
        url:
          type: string
          format: uri
        expiresIn:
          type: integer
        name:
          type: string
    DeliveryPreferences:
      type: object
      required:
      - digest
      - draftNotice
      - reports
      properties:
        digest:
          type: string
          enum:
          - 'off'
          - daily
          - weekly
        draftNotice:
          type: boolean
        reports:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - month
            - quarter
            - year
