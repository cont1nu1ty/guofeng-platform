# Paths are relative to /api/v1. Merge into the main OpenAPI document; bearerAuth is shared.
paths:
  /admin/accounts:
    get:
      summary: List scoped accounts
      security: &id001
      - bearerAuth: []
      parameters:
      - &id003
        name: query
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
          default: ''
      - name: role
        in: query
        required: false
        schema: &id006
          type: string
          enum:
          - national_admin
          - regional_admin
          - content_operator
          - review_manager
          - data_operator
          - expert
          - member
      - name: region
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - enabled
          - disabled
          - pending
          - approved
          - rejected
          - returned
      - &id004
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
      - &id005
        name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialAccountPage'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: Scope is independent from job role. Non-national operators can only see target accounts whose
        entire region set is contained in their scope, and cannot see national administrators.
      x-permissions:
      - users:read
    post:
      summary: Create an account through RuoYi user service
      security: *id001
      parameters:
      - &id002
        $ref: '#/components/parameters/CredentialIdempotencyKey'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMutationResult'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: Requires national_admin as well as permission. New expert grants require completed manual material
        review, so create as another role first. Role bindings reuse sys_user_role; permissions use sys_role_menu.
        No external identity verification is claimed.
      x-permissions:
      - users:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialAccountCreate'
  /admin/accounts/{id}:
    get:
      summary: Read account and permitted manual review history
      security: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialManagedAccount'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: reviews is empty without users:review permission. Scope applies.
      x-permissions:
      - users:read
  /admin/accounts/{id}/{action}:
    post:
      summary: Change role, status, password or manual review record
      security: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
          - roles
          - status
          - resetPassword
          - materials
          - review
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMutationResult'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: roles requires users:roles and national_admin, with roles+regionIds; status requires users:status
        and enabled; resetPassword requires users:resetPassword and national_admin, with password. materials/review
        require users:review and subject+summary; materials additionally requires materialReference; review requires
        result and prior submitted material. Materials and decisions append immutable history and do not automatically
        grant expert role. Self roles/status/resetPassword/review are refused. Every action requires current version.
        Role/status/reset changes advance authEpoch; old sessions are rejected immediately on next authenticated
        request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialAccountAction'
  /rights/agreement:
    get:
      summary: Current submission confirmation terms
      security: []
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialAgreement'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: Versioned checkbox terms, not an electronic signature or copyright registration.
  /me/copyright-confirmations:
    get:
      summary: Own explicit copyright confirmations
      security: *id001
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialCopyrightHistory'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: Latest 200 records, account-scoped; historic checkbox states are not backfilled into evidence.
  /submissions/{id}/copyright-confirmations:
    post:
      summary: Confirm current submission revision as its owner
      security: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMutationResult'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: Owner only; exact current revisionId, work version and current agreementVersion required. Persists
        full terms and hash, clears requiresAuthorConfirmation, sets copyrightAccepted; immutable jf_revision is
        not rewritten. Old terms or changed revision return 412.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCopyrightInput'
  /admin/certificates/eligible:
    get:
      summary: Find eligible award or completion sources
      security: *id001
      parameters:
      - *id003
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialEligibleSources'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: Maximum 100 entries per type, scoped by source region. Issuance rechecks live eligibility; source
        list is not approval.
      x-permissions:
      - certificates:write
  /admin/certificates:
    get:
      summary: List region-scoped certificates
      security: *id001
      parameters:
      - *id004
      - *id005
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialCertificatePage'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: ''
      x-permissions:
      - certificates:read
    post:
      summary: Manually issue and store a certificate PDF
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMutationResult'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: Award requires currently awarded submission and copyrightAccepted. Completion requires completed_at
        in jf_course_learning for this user, course and immutable publication version. One active certificate per
        source qualification; revoked issuance can be superseded while history remains. Issuer identifies platform
        manual issuance, not external e-signature.
      x-permissions:
      - certificates:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCertificateIssue'
  /admin/certificates/{id}/revoke:
    post:
      summary: Revoke certificate and retain public verification history
      security: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMutationResult'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: Region-scoped, exact version required; records actor, timestamp and reason. Refuses future download
        links. Previously downloaded bytes cannot be recalled; already-issued signed links remain usable until expiry.
      x-permissions:
      - certificates:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCertificateRevoke'
  /me/certificates:
    get:
      summary: List own certificate records
      security: *id001
      parameters:
      - *id004
      - *id005
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialCertificatePage'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: ''
  /certificates/{id}/download:
    get:
      summary: Authorize current certificate download
      security: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialAuthorizedDownload'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: Owner, or certificates:read plus source region. Revoked certificates return 410. Writes download
        audit with file hash; minted signed link is short-lived. Direct generic download of generated file is denied.
  /certificates/verify/{token}:
    get:
      summary: Anonymous certificate status check
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialPublicVerification'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: 'Public allow-list only: number, generic certificate title, issuer, status, issue/revocation
        timestamps, file hash. Does not disclose owner/name, work/course title, source key, account ID, private
        revocation reason or file URL.'
  /resources:
    get:
      summary: List published authorized resource metadata
      security: []
      parameters:
      - *id003
      - *id004
      - *id005
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResourcePage'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: Optional bearer authentication. Anonymous readers see all_members metadata only; signed-in readers
        also see resources for authorized regions. No fileId or direct object URL is returned.
  /admin/resources:
    get:
      summary: List managed region-scoped resources
      security: *id001
      parameters:
      - *id003
      - *id004
      - *id005
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResourcePage'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: ''
      x-permissions:
      - resources:read
    post:
      summary: Create an authorized resource directory entry
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMutationResult'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: PDF, Word or image file must be uploaded by actor. Generated private documents are forbidden.
        Own region scope required; publishing requires explicit authorized=true.
      x-permissions:
      - resources:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialResourceSave'
  /admin/resources/{id}:
    post:
      summary: Update resource licence, file, audience or status
      security: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMutationResult'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: Current version required. Retaining original file is allowed to scoped editors; replacement must
        be actor-owned upload. License, file hash, audience and status are audited.
      x-permissions:
      - resources:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialResourceSave'
  /resources/{id}/download:
    post:
      summary: Acknowledge current licence and authorize download
      security: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialAuthorizedDownload'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors. 401 authentication, 403 permission,
            404 scope/owner/unknown, 409 business conflict, 412 stale version, 422 validation, 428 missing version.'
      description: Authenticated account required. Resource must still be published and audience must be all_members
        or match account region. Exact resource version and acceptedLicense=true required. Audit captures version,
        file hash and licence hash; URL expires normally after 300 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialResourceDownload'
components:
  parameters:
    CredentialIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Keep identical key and payload for retries. Different payload under the same key conflicts. Scope
        includes actor and operation.
  schemas:
    CredentialMutationResult:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
        message:
          type: string
        certificateNo:
          type: string
        version: &id007
          type: integer
          minimum: 1
        signature:
          type: boolean
      required:
      - ok
    CredentialManagedAccount:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        organization:
          type: string
        roles:
          type: array
          items: *id006
        roleLabels:
          type: array
          items:
            type: string
        regionIds:
          type: array
          items:
            type: string
        regionLabels:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        accountReviewStatus:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - returned
        expertReviewStatus:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - returned
        legacyStatus:
          type: string
        version: *id007
        createdAt:
          type: string
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/CredentialAccountReview'
      required:
      - id
      - username
      - roles
      - regionIds
      - enabled
      - version
    CredentialAccountReview:
      type: object
      properties:
        id:
          type: string
        subject:
          type: string
          enum:
          - account
          - expert
        action:
          type: string
          enum:
          - submitted
          - approved
          - rejected
          - returned
        actorName:
          type: string
        summary:
          type: string
        materialReference:
          type: string
        createdAt:
          type: string
      required:
      - id
      - subject
      - action
      - summary
    CredentialAccountPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialManagedAccount'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        roles:
          type: array
          items:
            type: object
            properties:
              key: *id006
              label:
                type: string
        permissions:
          type: array
          items:
            type: string
    CredentialAccountCreate:
      type: object
      properties:
        username:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.-]{2,29}$
        name:
          type: string
          minLength: 1
          maxLength: 30
        organization:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 12
          description: Letter and digit required; maximum 72 UTF-8 bytes for BCrypt; not echoed.
        roles:
          type: array
          items: *id006
        regionIds:
          type: array
          items:
            type: string
      required:
      - username
      - name
      - organization
      - password
      - roles
      - regionIds
    CredentialAccountAction:
      type: object
      properties:
        version: *id007
        roles:
          type: array
          items: *id006
        regionIds:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        password:
          type: string
          minLength: 12
          description: Maximum 72 UTF-8 bytes; letter and digit required.
        subject:
          type: string
          enum:
          - account
          - expert
        result:
          type: string
          enum:
          - approved
          - rejected
          - returned
        summary:
          type: string
          minLength: 5
          maxLength: 2000
        materialReference:
          type: string
          maxLength: 1000
      required:
      - version
    CredentialAgreement:
      type: object
      properties:
        version:
          type: string
        text:
          type: string
        hash:
          type: string
        signature:
          type: boolean
          enum:
          - false
      required:
      - version
      - text
      - hash
      - signature
    CredentialCopyrightInput:
      type: object
      properties:
        version: *id007
        revisionId:
          type: string
        agreementVersion:
          type: string
        accepted:
          type: boolean
          enum:
          - true
      required:
      - version
      - revisionId
      - agreementVersion
      - accepted
    CredentialCopyrightRecord:
      type: object
      properties:
        id:
          type: string
        submissionId:
          type: string
        revisionId:
          type: string
        agreementVersion:
          type: string
        agreementText:
          type: string
        agreementHash:
          type: string
        acceptedAt:
          type: string
    CredentialCopyrightHistory:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialCopyrightRecord'
        agreement:
          $ref: '#/components/schemas/CredentialAgreement'
    CredentialPublicVerification:
      type: object
      properties:
        certificateNo:
          type: string
        title:
          type: string
        issuer:
          type: string
        status:
          type: string
          enum:
          - issued
          - revoked
        issuedAt:
          type: string
        revokedAt:
          type: string
          nullable: true
        fileHash:
          type: string
      required:
      - certificateNo
      - title
      - issuer
      - status
      - issuedAt
      - fileHash
    CredentialCertificate:
      allOf:
      - $ref: '#/components/schemas/CredentialPublicVerification'
      - type: object
        properties:
          id:
            type: string
          kind:
            type: string
            enum:
            - award
            - completion
          ownerId:
            type: string
          holderName:
            type: string
          sourceTitle:
            type: string
          region:
            type: string
          verifyToken:
            type: string
          version: *id007
          revokeReason:
            type: string
            nullable: true
    CredentialCertificatePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialCertificate'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    CredentialCertificateSource:
      type: object
      properties:
        kind:
          type: string
          enum:
          - award
          - completion
        sourceId:
          type: string
        ownerId:
          type: string
        name:
          type: string
        title:
          type: string
        region:
          type: string
        courseVersion:
          type: integer
    CredentialEligibleSources:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialCertificateSource'
        limitPerKind:
          type: integer
          enum:
          - 100
    CredentialCertificateIssue:
      type: object
      properties:
        kind:
          type: string
          enum:
          - award
          - completion
        sourceId:
          type: string
        ownerId:
          type: string
          description: Required for completion; award owner is derived from the submission.
        courseVersion:
          type: integer
          minimum: 1
          description: Required for completion; exact published course version.
        issuer:
          type: string
          minLength: 2
          maxLength: 120
      required:
      - kind
      - sourceId
      - issuer
    CredentialCertificateRevoke:
      type: object
      properties:
        version: *id007
        reason:
          type: string
          minLength: 5
          maxLength: 1000
      required:
      - version
      - reason
    CredentialAuthorizedDownload:
      type: object
      properties:
        url:
          type: string
          format: uri
        expiresIn:
          type: integer
          description: Signed links normally expire after 300 seconds; use durable business endpoint for future
            downloads.
    CredentialResource:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        regionId:
          type: string
        region:
          type: string
        fileId:
          type: string
          description: Admin response only; omitted from public catalog.
        fileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        sha256:
          type: string
        licenseText:
          type: string
        attribution:
          type: string
        audience:
          type: string
          enum:
          - all_members
          - authorized_regions
        status:
          type: string
          enum:
          - draft
          - published
          - withdrawn
        version: *id007
        updatedAt:
          type: string
    CredentialResourcePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialResource'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    CredentialResourceSave:
      type: object
      properties:
        version: *id007
        title:
          type: string
          minLength: 2
          maxLength: 160
        description:
          type: string
          minLength: 5
          maxLength: 2000
        regionId:
          type: string
        fileId:
          type: string
        licenseText:
          type: string
          minLength: 10
          maxLength: 4000
        attribution:
          type: string
          minLength: 2
          maxLength: 500
        audience:
          type: string
          enum:
          - all_members
          - authorized_regions
        status:
          type: string
          enum:
          - draft
          - published
          - withdrawn
        authorized:
          type: boolean
          description: 'Must be true to publish: current operator confirms distribution authority.'
