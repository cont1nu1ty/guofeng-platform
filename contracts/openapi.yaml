        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExportJob'
                  total:
                    type: integer
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createExportJob
      summary: Freeze an authorized snapshot then enqueue a durable export
      description: Reports require analytics:export; collections require collections:export;
        submission CSV requires submissions:export; other CSV requires jobs:export
        plus module read. One CSV request is limited to 5000 records; 1-20 collections;
        PDF/DOCX documents to 500000 characters. Database snapshot contains the actual
        authorized records, not only a timestamp.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                properties:
                  id:
                    type: string
                  status:
                    enum:
                    - queued
        default:
          $ref: '#/components/responses/Error'
  /admin/exports/{id}/{action}:
    post:
      operationId: controlExportJob
      summary: Retry a failed job or cancel a queued/running/failed job
      description: Revalidates current export permission and frozen authorized scope.
        Generation fencing prevents cancelled workers from publishing results.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
          - retry
          - cancel
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
  /admin/exports/{id}/download:
    get:
      operationId: downloadExport
      summary: Issue a short-lived private URL after owner, permission and scope recheck
      description: Non-report exports expire after 7 days. Archived report files have
        no application expiry. Existing signed URLs remain valid until their short
        expiry; no claim to recall downloaded copies. Every request is audited.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedDownload'
        default:
          $ref: '#/components/responses/Error'
  /me/delivery-preferences:
    get:
      operationId: deliveryPreferences
      summary: Own digest, draft and report preferences
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryPreferences'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateDeliveryPreferences
      summary: Save preferences executed by durable scheduling
      description: Digests/reports default off. Draft notifications are gated by the
        platform draftNotice switch. Daily/weekly digests count prior complete periods;
        monthly/quarterly/yearly reports begin at a period boundary after enabling.
        All periods use Asia/Shanghai. Reports additionally require analytics:export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryPreferences'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryPreferences'
        default:
          $ref: '#/components/responses/Error'
  /engagement/events:
    post:
      operationId: recordEngagement
      summary: Record a signed-in view or share intent for published content
      description: Deduplicates by account/content/action/Beijing calendar day. No
        anonymous fingerprint or IP is stored. Share intent is not evidence of successful
        forwarding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kind
              - targetId
              - action
              properties:
                kind:
                  type: string
                  enum:
                  - media
                  - submission
                  - content
                  - collection
                targetId:
                  type: string
                  maxLength: 64
                action:
                  type: string
                  enum:
                  - view
                  - share_intent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded:
                    type: boolean
                  metricVersion:
                    type: string
        default:
          $ref: '#/components/responses/Error'
  /admin/review-assignments/candidates:
    get:
      operationId: reviewAssignmentCandidates
      summary: 读取当前稿件可分配专家
      description: Requires reviews:manage and manuscript province scope. Filters
        active expert-role accounts, own-author conflicts, account scope and availability;
        independent of paginated UI expert list.
      parameters:
      - in: query
        name: submissionId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    region:
                      type: string
                    group:
                      type: string
                    availability:
                      type: string
                    openTasks:
                      type: integer
        default:
          $ref: '#/components/responses/Error'
  /admin/review-assignments/preview:
    post:
      operationId: previewReviewAssignments
      summary: 预览确定性批量分配
      description: Requires reviews:manage. Read-only. Selects scope/group/availability,
        fewest active pending tasks, then stable expert ID. Selected work versions
        are checked. No WarmFlow mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentPlan'
        default:
          $ref: '#/components/responses/Error'
  /admin/review-assignments/confirm:
    post:
      operationId: confirmReviewAssignments
      summary: 确认预览分配
      description: Requires reviews:manage. Locks manuscripts and experts, recomputes
        preview fingerprint. Stale state returns 409; supplied stale work version
        returns 412. Transactional all selected assignments reuse existing assignReview
        and WarmFlow.
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        description: Persist key across retries. Same owner/key with changed payload
          returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentConfirmation'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  assigned:
                    type: integer
                  excluded:
                    type: array
                    items:
                      type: object
        default:
          $ref: '#/components/responses/Error'
  /admin/submission-imports/preview:
    post:
      operationId: previewOfflineSubmissions
      summary: 预检线下文字稿件
      description: Requires submissions:write; existing member owner, own account
        province and operator province required. Maximum 100 rows. Source name+reference
        unique globally. Reports row errors; creates no data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineImportInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineImportPlan'
        default:
          $ref: '#/components/responses/Error'
  /admin/submission-imports/confirm:
    post:
      operationId: confirmOfflineSubmissions
      summary: 确认线下归集
      description: 'Requires submissions:write. Rechecks fingerprint/all errors; saves
        immutable revision, source and workflow/rubric binding, sends account message.
        Does not sign for author: copyrightAccepted=false and requiresAuthorConfirmation=true;
        initial approval remains blocked until owner''s independent copyright confirmation.'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        description: Persist key across retries. Same owner/key with changed payload
          returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineImportConfirmation'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  imported:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        revisionId:
                          type: string
        default:
          $ref: '#/components/responses/Error'
  /regions/children:
    get:
      operationId: publicRegionChildren
      summary: 读取已启用的市县子节点
      description: Empty parentId returns existing province dictionary; unpublished/disabled
        ancestors are hidden. Display taxonomy never changes province-level authorization.
      security: []
      parameters:
      - in: query
        name: parentId
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegionNode'
                  notice:
                    type: string
        default:
          $ref: '#/components/responses/Error'
  /regions/venues:
    get:
      operationId: publicRegionVenues
      summary: 读取市县已发布阵地 ID
      description: Exact county or city with its direct counties; only enabled nodes
        and published venues. Invalid/disabled node 404.
      security: []
      parameters:
      - in: query
        name: areaId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ids:
                    type: array
                    items:
                      type: string
        default:
          $ref: '#/components/responses/Error'
  /regions/venue-map/{id}:
    get:
      operationId: publicVenueMapSettings
      summary: 读取已发布阵地坐标系
      description: Public only for published venue. Coordinate provenance explicitly
        maintained by staff. No implicit WGS84/GCJ02 conversion.
      security: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  coordinateSystem:
                    type: string
                    enum:
                    - unknown
                    - wgs84
                    - gcj02
        default:
          $ref: '#/components/responses/Error'
  /regions/venue-coordinates:
    get:
      operationId: publicVenueCoordinates
      summary: 读取经核对 WGS84 阵地坐标
      description: Only published non-sample venues explicitly marked wgs84. Used
        for client-side distance sorting; no user location is sent to server.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        latitude:
                          type: number
                        longitude:
                          type: number
        default:
          $ref: '#/components/responses/Error'
  /admin/regions:
    get:
      operationId: adminRegionChildren
      summary: 读取授权地区子目录
      description: Requires regions:read and parent province scope. Includes disabled
        nodes.
      parameters:
      - in: query
        name: parentId
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegionNode'
                  notice:
                    type: string
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: saveRegionNode
      summary: 新增或维护市县节点
      description: Requires regions:write and parent province scope. At most province/city/county.
        Parent of an existing node immutable; updates require version. Source required;
        no fabricated nationwide city dataset.
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        description: Persist key across retries. Same owner/key with changed payload
          returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionNode'
        default:
          $ref: '#/components/responses/Error'
  /admin/regions/venues/{id}:
    get:
      operationId: getVenueAreaBinding
      summary: 读取阵地市县与坐标来源
      description: Requires content:write and venue province scope.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueAreaBinding'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: saveVenueAreaBinding
      summary: 保存阵地市县与坐标来源
      description: Requires content:write, same-province enabled city/county, and
        current venue version. Empty areaId removes association. Bumps venue version
        and public generation. Changes neither venue coordinates nor province scope.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        description: Persist key across retries. Same owner/key with changed payload
          returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueAreaInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueAreaBinding'
        default:
          $ref: '#/components/responses/Error'
  /admin/consultations/{id}:
    get:
      operationId: getAdminConsultation
      summary: 读取定制咨询跟进
      description: Requires welfare:read and claim province scope; only kind=custom.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: followUpConsultation
      summary: 保存人工沟通或参考报价
      description: Requires welfare:write, province scope, current claim version,
        kind=custom. Cancelled claims reject follow-up. Appends immutable customer-visible
        event and sends station notification. Does not create payment/order/logistics
        or change inventory. May record a new stage after closed; prior history remains.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        description: Persist key across retries. Same owner/key with changed payload
          returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
        default:
          $ref: '#/components/responses/Error'
  /me/consultations/{id}:
    get:
      operationId: getMyConsultation
      summary: 本人查询定制咨询历史
      description: Authenticated owner only; other owners and non-custom claims get
        404. No operator identity is returned.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      example: '"3"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: 同一逻辑操作失败重试保持相同键；新的操作必须换键。
    CredentialIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Keep identical key and payload for retries. Different payload under
        the same key conflicts. Scope includes actor and operation.
    EducationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Reuse the same key and body when retrying an uncertain result;
        never reuse for a different operation body.
  responses:
    Error:
      description: 400请求格式；401会话；403岗位；404不可见；409业务/幂等冲突；412版本冲突；413文件大小；422校验；428缺版本/幂等键；429登录限流；500内部错误；503未启用适配。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
      required:
      - code
      - message
      - requestId
    ActionResult:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - member
            - expert
            - regional_admin
            - national_admin
        regionIds:
          type: array
          items:
            $ref: '#/components/schemas/RegionId'
        permissions:
          type: array
          items:
            type: string
        version:
          type: integer
      required:
      - id
      - name
      - roles
      - regionIds
      - permissions
      - version
    RegionId:
      type: string
      enum:
      - all
      - beijing
      - tianjin
      - hebei
      - shanxi
      - inner-mongolia
      - liaoning
      - jilin
      - heilongjiang
      - shanghai
      - jiangsu
      - zhejiang
      - anhui
      - fujian
      - jiangxi
      - shandong
      - henan
      - hubei
      - hunan
      - guangdong
      - guangxi
      - hainan
      - chongqing
      - sichuan
      - guizhou
      - yunnan
      - xizang
      - shaanxi
      - gansu
      - qinghai
      - ningxia
      - xinjiang
      - hong-kong
      - macao
      - taiwan
      - overseas
    File:
      type: object
      properties:
        fileId:
          type: string
        id:
          type: string
        name:
          type: string
        size:
          type: integer
        type:
          type: string
          enum:
          - image
          - word
          - pdf
        mimeType:
          type: string
        purpose:
          type: string
          enum:
          - manuscript
          - media
          - recitation
        duration:
          type: number
          description: 录音归一化后的秒数
        originalName:
          type: string
      required:
      - fileId
      - id
      - name
      - size
      - type
      - mimeType
    SubmissionInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 50
        author:
          type: string
          maxLength: 100
        content:
          type: string
          maxLength: 10000
        contentDelta:
          type: object
          description: 仅文本insert与bold/italic/underline/header(2,3)/list(ordered,bullet)，纯文本须与content一致。
        region:
          $ref: '#/components/schemas/RegionId'
        genre:
          type: string
          enum:
          - letter
          - essay
          - poetry
          - memoir
          - biography
          - family-rules
          - family-notes
          - commentary
        channel:
          type: string
          enum:
          - public-service
          - school
          - community
          - special
        themes:
          type: array
          maxItems: 3
          items:
            type: string
            enum:
            - integrity
            - filial
            - neighbor
            - patriotism
            - heritage
            - family-history
        copyrightAccepted:
          type: boolean
        overseasLocation:
          type: string
        attachments:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              fileId:
                type: string
              id:
                type: string
        editingWorkId:
          type: string
      required:
      - title
      - content
      - region
      - genre
      - channel
      - themes
      - copyrightAccepted
      - attachments
    DraftEnvelope:
      type: object
      properties:
        draft:
          allOf:
          - $ref: '#/components/schemas/SubmissionInput'
          nullable: true
      required:
      - draft
    Work:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        content:
          type: string
        contentDelta:
          type: object
        region:
          $ref: '#/components/schemas/RegionId'
        version:
          type: integer
        lockVersion:
          type: integer
        revisionNumber:
          type: integer
        status:
          type: string
          enum:
          - pending_initial_review
          - in_review
          - returned
          - shortlisted
          - rejected
          - awarded
          - collected
        published:
          type: boolean
        isMine:
          type: boolean
        isDemo:
          type: boolean
          enum:
          - false
        submittedAt:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/File'
        reviews:
          type: array
          items:
            type: object
        history:
          type: array
          items:
            type: object
      required:
      - id
      - title
      - content
      - region
      - version
      - status
      - published
      - isMine
      - isDemo
    Revision:
      type: object
      properties:
        id:
          type: string
        revisionNumber:
          type: integer
        content:
          $ref: '#/components/schemas/SubmissionInput'
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - revisionNumber
      - content
      - createdAt
    Entity:
      type: object
      description: 各业务DTO的稳定元信息；新增业务字段由domain适配层处理，页面不解析若依原生响应。
      properties:
        id:
          type: string
        regionId:
          $ref: '#/components/schemas/RegionId'
        region:
          type: string
          description: 后台展示名称；不是授权来源
        status:
          type: string
        lockVersion:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    Dimension:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        min:
          type: integer
        max:
          type: integer
          enum:
          - 15
          - 25
          - 30
    ReviewWindowFields:
      type: object
