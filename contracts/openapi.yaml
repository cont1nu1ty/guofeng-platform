    post:
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/EducationIdempotencyKey'
      description: course.progress takes publicationVersion plus lessonId or answers
        mapping questionId to optionId. Version 0 is read-only. All lessons must be
        confirmed before a server-graded quiz. Retries create attempts; completion
        persists once achieved for that frozen version. No accredited time claim.
        education.requestIdentity takes organization/requestNote and current identity
        version when updating. education.confirmDeclaration takes group entityId,
        current group version, accepted=true and textHash. Current visibility/membership
