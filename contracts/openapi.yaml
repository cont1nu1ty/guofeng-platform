openapi: 3.0.3
info:
  title: 家风中华行后端衔接草案
  version: 0.1.0-draft
  description: |
    仅供讨论和后续开发的契约；当前应用是本机单用户 Mock 演示，没有这些 HTTP 服务。
    字段对照 apps/miniapp/src/domain/types.ts；生产接入需异步仓库和 DTO 适配。
    tenant 由服务端基于可信身份路由，region 只是展示过滤，不能扩大数据访问权限。
    当前地区与状态枚举是演示子集；六级评审配置未定。AI 和评审接口均为后期设计。
    此版本不包含鉴权服务、附件上传/预签名、AI 结果查询、详情拆分或多租户同步接口。
servers:
  - url: https://api.example.invalid/v1
    description: 保留域名占位，不是可调用服务
security:
  - bearerAuth: []
tags:
  - name: works
    description: 作品与草稿
  - name: content
    description: 典籍与活动
  - name: me
    description: 当前认证用户的记录
  - name: future
    description: 后期能力，尚未实现
paths:
  /works:
    get:
      tags: [works]
      operationId: listWorks
      summary: 查询公开作品或我的作品
      description: |
        scope=public 仅返回已批准公开内容；scope=mine 必须认证，归属由服务端身份确定。
        region 不改变授权范围。当前草案含正文，正式长文列表需拆为摘要/详情契约。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [public, mine], default: public }
        - $ref: '#/components/parameters/Region'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: genre
          in: query
          schema: { $ref: '#/components/schemas/GenreId' }
        - name: channel
          in: query
          schema: { $ref: '#/components/schemas/ChannelId' }
      responses:
        '200':
          description: 作品分页
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Work' } }
                  nextCursor: { type: string, nullable: true }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [works]
      operationId: submitWork
      summary: 提交作品
      description: |
        本草案仅接受正文，不支持附件。服务端验证字段、身份、地区归属及协议记录。
        copyrightAccepted 不等于完成正式电子签署；上线前还需协议版本和确认凭证契约。
        幂等同键同载荷返回首次响应；同键不同载荷 409。提交成功是否清草稿需与前端协调。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmissionInput' }
      responses:
        '201':
          description: 作品受理成功，状态不表示完成评审
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Work' }
        default: { $ref: '#/components/responses/Error' }
  /me/draft:
    get:
      tags: [works, me]
      operationId: getMyDraft
      summary: 读取当前用户唯一草稿
      description: 无草稿返回 draft=null，同时返回用于首次写入的初始 ETag。
      responses:
        '200':
          description: 草稿及并发版本
          headers:
            ETag:
              description: 当前用户草稿槽版本，包括空槽
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [draft]
                properties:
                  draft:
                    type: object
                    nullable: true
                    additionalProperties: false
                    required: [title, content, genre, channel, region, copyrightAccepted]
                    properties:
                      title: { type: string }
                      content: { type: string }
                      genre: { $ref: '#/components/schemas/GenreId' }
                      channel: { $ref: '#/components/schemas/ChannelId' }
                      region: { $ref: '#/components/schemas/RegionId' }
                      author: { type: string }
                      copyrightAccepted: { type: boolean }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [works, me]
      operationId: saveMyDraft
      summary: 保存草稿，允许未完成内容
      description: 先 GET 获取 ETag；If-Match 过期返回 412，缺失返回 428。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftInput' }
      responses:
        '200':
          description: 已保存草稿
          headers:
            ETag:
              schema: { type: string }
              description: 保存后的版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftInput' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [works, me]
      operationId: clearMyDraft
      summary: 清空当前用户草稿
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: 已清空或原本为空 }
        default: { $ref: '#/components/responses/Error' }
  /works/{workId}/progress:
    get:
      tags: [works]
      operationId: getWorkProgress
      summary: 按作品编号查询允许查看的进度
      description: |
        仅作品本人或有权限运营可查询完整进度；不存在和不可见均可返回 404 以免泄露。
        公开公示名单另行设计；这里不允许通过猜编号查看他人私人稿件。
        stages 来自服务端流程版本，当前六级仅为待确认示意。
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 可见的进度
          content:
            application/json:
              schema:
                type: object
                required: [workId, status, progressIndex, stages, tentative]
                properties:
                  workId: { type: string }
                  status: { $ref: '#/components/schemas/WorkStatus' }
                  progressIndex: { type: integer, minimum: 0 }
                  tentative: { type: boolean, description: 是否仍为示意流程 }
                  stages:
                    type: array
                    items:
                      type: object
                      required: [id, label, description, tentative]
                      properties:
                        id: { type: string }
                        label: { type: string }
                        description: { type: string }
                        tentative: { type: boolean }
        default: { $ref: '#/components/responses/Error' }
  /classics:
    get:
      tags: [content]
      operationId: listClassics
      summary: 查询公开典籍
      security: []
      parameters:
        - $ref: '#/components/parameters/Region'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 典籍分页；长篇正文后续拆分章节
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Classic' } }
                  nextCursor: { type: string, nullable: true }
        default: { $ref: '#/components/responses/Error' }
  /activities:
    get:
      tags: [content]
      operationId: listActivities
      summary: 查询公开活动
      security: []
      parameters:
        - $ref: '#/components/parameters/Region'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 活动分页
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Activity' } }
                  nextCursor: { type: string, nullable: true }
        default: { $ref: '#/components/responses/Error' }
  /me/registrations:
    get:
      tags: [me]
      operationId: listMyRegistrations
      summary: 查询我的预约
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 当前认证用户的预约分页
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Registration' } }
                  nextCursor: { type: string, nullable: true }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [me]
      operationId: registerActivity
      summary: 预约活动
      description: |
        不接受 userId 或 tenantId；服务端校验活动开放、时间及名额并原子扣减。
        已预约时返回已有记录 200；新预约 201；满额或状态冲突 409。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [activityId]
              properties:
                activityId: { type: string }
      responses:
        '201':
          description: 新预约成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '200':
          description: 返回已有预约
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        default: { $ref: '#/components/responses/Error' }
  /me/registrations/{activityId}:
    delete:
      tags: [me]
      operationId: cancelMyRegistration
      summary: 取消我的预约
      description: 只能取消本人记录；取消时间规则待业务确认，状态不允许取消返回 409。
      parameters:
        - name: activityId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: 预约已取消或不存在，重试不产生重复影响 }
        default: { $ref: '#/components/responses/Error' }
  /me/favorites:
    get:
      tags: [me]
      operationId: listMyFavorites
      summary: 查询我的收藏
      description: 内容失效或不再可见时不能泄露正文；移除或返回占位策略后续确认。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 收藏引用分页；内容详情由后续详情契约读取
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Favorite' } }
                  nextCursor: { type: string, nullable: true }
        default: { $ref: '#/components/responses/Error' }
  /me/favorites/{contentId}:
    parameters:
      - name: contentId
        in: path
        required: true
        schema: { type: string }
      - name: contentType
        in: query
        required: true
        schema: { type: string, enum: [work, classic] }
    put:
      tags: [me]
      operationId: addMyFavorite
      summary: 设为已收藏
      description: 幂等设置状态，不是 toggle；只能收藏本人有权查看的内容。
      responses:
        '200':
          description: 已收藏或已存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favorite' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [me]
      operationId: removeMyFavorite
      summary: 取消收藏
      responses:
        '204': { description: 已取消或原本未收藏 }
        default: { $ref: '#/components/responses/Error' }
  /ai/tasks:
    post:
      tags: [future]
      operationId: createAiTask
      summary: 后期 AI 任务受理草案
      description: |
        尚未实现。不表示接入外网模型；按原文私有部署要求另行选型。
        本版仅约定受理，结果查询、取消和流式输出需后续契约，不能据此完成整套 AI 接入。
        服务端校验任务授权、输入长度、配额、内容处理及审计策略。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [taskType, input]
              properties:
                taskType: { type: string, enum: [qa, family_letter, polish] }
                input: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        '202':
          description: 仅已受理，不表示推理完成
          content:
            application/json:
              schema:
                type: object
                required: [id, status, createdAt]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [queued] }
                  createdAt: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }
  /review/tasks:
    get:
      tags: [future]
      operationId: listMyReviewTasks
      summary: 后期本人评审任务列表草案
      description: |
        服务端按专家身份和分配记录筛选；盲审不返回作者等受限字段。
        各条 version 是提交评分时的 If-Match 值；规则和层级尚待确认。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 授权任务分页
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReviewTask' } }
                  nextCursor: { type: string, nullable: true }
        default: { $ref: '#/components/responses/Error' }
  /review/tasks/{taskId}/score:
    put:
      tags: [future]
      operationId: submitReviewScore
      summary: 后期提交评审评分草案
      description: |
        服务端验证分配、任务状态、窗口、ruleVersion 和每个评分维度的范围。
        If-Match 使用任务 version；版本冲突 412，缺失 428。仅 UI 校验不构成有效鉴权。
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ruleVersion, scores, comment]
              properties:
                ruleVersion: { type: string }
                scores:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [dimensionId, value]
                    properties:
                      dimensionId: { type: string }
                      value: { type: number }
                comment: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '200':
          description: 评分已记录；后续晋级由确认的流程规则决定
          headers:
            ETag:
              description: 最新任务版本
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewTask' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 服务端验证的会话凭据；本项目未实现登录和凭据服务，格式待后端决定。
  parameters:
    Region:
      name: region
      in: query
      description: 仅展示过滤；all 不扩大身份或租户权限。当前为演示地区子集。
      schema: { $ref: '#/components/schemas/RegionId' }
    Cursor:
      name: cursor
      in: query
      description: 与筛选及身份范围绑定的不透明游标，首次省略
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        每次逻辑提交唯一；重试复用相同值。按认证身份、可信租户和路径隔离。
        同键同载荷重放首次响应，不同载荷 409；保留窗口待上线前确认。
      schema: { type: string, minLength: 8, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 上次读取的 ETag/任务版本；过期 412，缺失 428，禁止通配绕过版本校验。
      schema: { type: string }
  responses:
    Error:
      description: |
        统一错误：401 未认证，403 无权限，404 不存在或不可见，409 状态或幂等冲突，
        412 版本过期，422 字段错误，428 缺少并发条件，429 限流，503 暂时不可用。
        其他错误同样遵循该结构，不向客户端暴露内部实现或私密数据。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    RegionId:
      type: string
      enum: [all, beijing, zhejiang, sichuan]
      description: 当前演示枚举；正式行政区字典待设计。all 不代表全部租户权限。
    GenreId:
      type: string
      enum: [letter, essay, poetry, memoir, biography, family-rules, family-notes, commentary]
    ChannelId:
      type: string
      enum: [public-service, school, community, special]
    WorkStatus:
      type: string
      enum: [pending_initial_review, in_review, collected]
      description: 当前模型子集，正式退回/撤回/拒绝等状态待业务确认后补充。
    DraftInput:
      type: object
      additionalProperties: false
      required: [title, content, genre, channel, region, copyrightAccepted]
      properties:
        title: { type: string, description: 草稿允许为空 }
        content: { type: string, description: 草稿允许为空 }
        genre: { $ref: '#/components/schemas/GenreId' }
        channel: { $ref: '#/components/schemas/ChannelId' }
        region: { $ref: '#/components/schemas/RegionId' }
        author: { type: string }
        copyrightAccepted: { type: boolean, description: 草稿布尔状态，不是电子签署凭证 }
    SubmissionInput:
      type: object
      additionalProperties: false
      required: [title, content, genre, channel, region, copyrightAccepted]
      properties:
        title: { type: string, minLength: 2, maxLength: 50, description: 去除首尾空白后按 Unicode 字符校验 }
        content: { type: string, minLength: 20, description: 去除首尾空白后至少 20 个 Unicode 字符 }
        genre: { $ref: '#/components/schemas/GenreId' }
        channel: { $ref: '#/components/schemas/ChannelId' }
        region: { $ref: '#/components/schemas/RegionId' }
        author: { type: string, description: 显示作者不等于投稿账户；正式关系需业务确认 }
        copyrightAccepted: { type: boolean, enum: [true], description: 仅声明确认标记，正式协议版本及证据另行扩展 }
    Work:
      type: object
      required: [id, title, content, excerpt, author, genre, channel, region, status, statusLabel, submittedAt, progressIndex, tags, isMine, isDemo]
      properties:
        id: { type: string, readOnly: true }
        title: { type: string }
        content: { type: string }
        excerpt: { type: string }
        author: { type: string }
        genre: { $ref: '#/components/schemas/GenreId' }
        channel: { $ref: '#/components/schemas/ChannelId' }
        region: { $ref: '#/components/schemas/RegionId' }
        status: { $ref: '#/components/schemas/WorkStatus' }
        statusLabel: { type: string, readOnly: true, description: 展示文案不是状态判断依据 }
        submittedAt: { type: string, format: date-time, readOnly: true }
        progressIndex: { type: integer, minimum: 0, readOnly: true, description: 展示位置，不替代流程权限判断 }
        tags: { type: array, items: { type: string } }
        isMine: { type: boolean, readOnly: true, description: 按服务端认证身份计算 }
        isDemo: { type: boolean, readOnly: true, description: 当前 TS 类型固定 true，生产接入需明确适配 }
    Classic:
      type: object
      required: [id, title, subtitle, author, excerpt, content, region, category, coverColor, chapterCount, isDemo]
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: string }
        author: { type: string }
        excerpt: { type: string }
        content: { type: string }
        region: { $ref: '#/components/schemas/RegionId' }
        category: { type: string }
        coverColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        chapterCount: { type: integer, minimum: 0 }
        isDemo: { type: boolean, readOnly: true }
    Activity:
      type: object
      required: [id, title, excerpt, content, region, location, organizer, date, time, category, capacity, registeredCount, isDemo]
      properties:
        id: { type: string }
        title: { type: string }
        excerpt: { type: string }
        content: { type: string }
        region: { $ref: '#/components/schemas/RegionId' }
        location: { type: string }
        organizer: { type: string }
        date: { type: string, format: date }
        time: { type: string, description: 当前为展示时段，正式时区及起止时间另行扩展 }
        category: { type: string }
        capacity: { type: integer, minimum: 0 }
        registeredCount: { type: integer, minimum: 0, readOnly: true }
        isDemo: { type: boolean, readOnly: true }
    Registration:
      type: object
      required: [activityId, registeredAt, isDemo]
      properties:
        activityId: { type: string }
        registeredAt: { type: string, format: date-time, readOnly: true }
        isDemo: { type: boolean, readOnly: true }
    Favorite:
      type: object
      required: [contentId, contentType]
      properties:
        contentId: { type: string }
        contentType: { type: string, enum: [work, classic] }
    ReviewTask:
      type: object
      required: [id, workId, title, status, ruleVersion, version, dimensions]
      description: 后期任务投影；不返回作者身份等盲审受限字段，正文详情契约待补充。
      properties:
        id: { type: string }
        workId: { type: string }
        title: { type: string }
        status: { type: string, enum: [pending, submitted] }
        ruleVersion: { type: string }
        version: { type: string, description: 可用作 If-Match 的带引号 ETag 值 }
        dimensions:
          type: array
          items:
            type: object
            required: [id, label, min, max]
            properties:
              id: { type: string }
              label: { type: string }
              min: { type: number }
              max: { type: number }
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string, example: VALIDATION_FAILED }
        message: { type: string, example: 请检查投稿字段。 }
        requestId: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
