openapi: 3.0.3
info:
  title: 家风中华行本机真实业务接口
  version: 1.3.0-local
  description: 已实现的HTTP契约。采用若依Sa-Token会话，家风模块返回直接DTO；原生若依系统接口保留但不作为本契约。单库服务端地区/归属/任务授权。开发账号仅开发配置启用；微信、模型推理、支付、电子签章与全国容量未交付。数据库保存业务ID、S3对象键和版本；公开发布、处理状态、最终结果独立。
servers:
- url: http://127.0.0.1:18080/api/v1
  description: 默认Compose入口；局域网需修改绑定与S3公共端点
security:
- bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      summary: 数据库迁移完成后的就绪检查
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    enum:
                    - ok
                    type: string
                  schemaVersion:
                    type: integer
        default:
          $ref: '#/components/responses/Error'
        '503':
          description: 初始化未完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - {}
      - bearerAuth: []
  /auth/login:
    post:
      operationId: login
      summary: 账号密码登录；开发账号与受控正式密码登录由独立配置启用
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                client:
                  type: string
                  enum:
                  - admin
                  - member
              required:
              - username
              - password
              - client
      security:
      - {}
      - bearerAuth: []
  /auth/me:
    get:
      operationId: currentUser
      summary: 当前会话及最新授权
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      summary: 退出当前会话
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        default:
          $ref: '#/components/responses/Error'
  /auth/wechat:
    post:
      operationId: wechatAdapter
      summary: 微信登录适配入口，尚未启用
      security: []
      responses:
        '503':
          description: WECHAT_NOT_CONFIGURED；未执行code交换
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /workspace:
    get:
      operationId: memberWorkspace
      summary: 公开内容及当前账号本人数据
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberWorkspace'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
      description: 未登录只返回已发布公开内容。带有效会话时额外返回本人稿件、消息、报名和学习记录；专家仅取得分配给自己的脱敏材料。草稿、下架内容及其他用户私有数据不可见。列表暂为本机规模完整集合，没有分页或容量承诺。
  /admin/review-alerts:
    get:
      operationId: adminReviewAlerts
      summary: 当前临期和逾期任务，以及本人评审通知
      description: 服务端按角色与地区裁剪；专家仅可查看本人任务，材料保持匿名。scope=mine 为本人负责或本人分配任务，all 为全部授权范围。历史逾期任务只展示不补发提醒。notifications
        为本人最新最多100条评审通知，未读优先；unreadCount 为本人完整未读数。
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: phase
        in: query
        schema:
          type: string
          enum:
          - all
          - due_soon
          - overdue
          default: all
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - mine
          - all
          default: mine
      - name: unreadOnly
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: 已按当前会话裁剪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewAlertsResponse'
        default:
          $ref: '#/components/responses/Error'
  /admin/workspace:
    get:
      operationId: adminWorkspace
      summary: 按岗位和地区裁剪的后台工作区
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorkspace'
        default:
          $ref: '#/components/responses/Error'
      description: 区域筛选由客户端在已授权集合上缩小；接口不接受扩大权限的region参数。专家只取得本人任务和脱敏材料。后台原有13页共享一次聚合读取。
  /me/draft:
    get:
      operationId: getDraft
      summary: 本人草稿及ETag
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEnvelope'
          headers:
            ETag:
              schema:
                type: string
              description: 带双引号的槽版本；即使draft=null也有版本，如 "0"。
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: saveDraft
      summary: 条件保存本人草稿
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEnvelope'
          headers:
            ETag:
              schema:
                type: string
              description: 带双引号的槽版本；即使draft=null也有版本，如 "0"。
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionInput'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
    delete:
      operationId: clearDraft
      summary: 确认提交成功后条件清除编辑状态
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEnvelope'
          headers:
            ETag:
              schema:
                type: string
              description: 带双引号的槽版本；即使draft=null也有版本，如 "0"。
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
  /files:
    post:
      operationId: uploadFile
      summary: multipart上传到私有S3，返回永久fileId
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      description: 默认每文件1字节至10MiB，PNG/JPEG/PDF/DOC/DOCX；purpose=media接受MP4/MP3/WAV≤50MiB及图片≤10MiB。校验扩展名和文件头，DOCX验证容器结构。只接受已登录账号；失败不产生可提交的fileId。不属于病毒扫描、媒体解码兼容或文档内容安全鉴定。小程序通过uni.uploadFile。
        purpose=recitation仅会员，最大10MiB/180秒，接受MP3/WAV/M4A/AAC/OGG/WebM，实际解码验证并归一化MP3后存储；忙碌或处理失败不产生有效fileId。
      parameters:
      - name: purpose
        in: query
        schema:
          type: string
          enum:
          - manuscript
          - media
          - recitation
        description: 省略或manuscript：原图/PDF/Word限制10MiB；media：MP4/MP3/WAV≤50MiB，图片≤10MiB。后端校验实际文件头；不能把媒体绑定为稿件附件。
          recitation：私有诵读纯音频，10MiB/180秒，输出MP3。
  /files/{id}/download:
    get:
      operationId: downloadFile
      summary: 校验附件业务权限后签发五分钟URL
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  expiresIn:
                    type: integer
                    enum:
                    - 300
                  name:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      description: 本人或获准地区运营读取关联稿件；专家不能取得原始附件。数据库不存签名地址。URL在有效期内为持有者凭据。
  /files/{id}/url:
    get:
      operationId: downloadFileAlias
      summary: 校验附件业务权限后签发五分钟URL
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  expiresIn:
                    type: integer
                    enum:
                    - 300
                  name:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      description: 本人或获准地区运营读取关联稿件；专家不能取得原始附件。数据库不存签名地址。URL在有效期内为持有者凭据。
  /submissions:
    post:
      operationId: submitWork
      summary: 受理新稿并生成不可变版本
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionInput'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /submissions/{id}/revisions:
    post:
      operationId: reviseWork
      summary: 退修重投：保留作品ID、新增版本、回到初审
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionInput'
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /submissions/{id}/progress:
    get:
      operationId: workProgress
      summary: 本人或获准运营读取进度及历史版本
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  work:
                    $ref: '#/components/schemas/Work'
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Revision'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
  /commands:
    post:
      operationId: memberCommand
      summary: 执行本人业务动作
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    additionalProperties: true
                  workspace:
                    $ref: '#/components/schemas/MemberWorkspace'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCommand'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /admin/commands:
    post:
      operationId: adminCommand
      summary: 执行授权后台业务动作
      responses:
        '200':
          description: 成功；默认保留受当前权限过滤的legacy workspace，compact模式省略workspace并返回permissions/roles。
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    additionalProperties: true
                  workspace:
                    $ref: '#/components/schemas/AdminWorkspace'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommand'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: X-Workspace-Mode
        in: header
        schema:
          type: string
          enum:
          - compact
        description: compact returns result, current roles and permissions without
          all workspace arrays; clients refresh the bounded active page.
      description: 写入在数据库事务内执行。更新已有记录必须携带workspace.lockVersion；batchApproveSubmissions使用data.versions。首次请求需幂等键，同键同载荷重放结果，工作区按当前权限重新投影；同键不同载荷409。认证、权限、校验失败不会演示回退。
  /files/{id}/public:
    get:
      operationId: publishedAsset
      summary: 已发布目录引用的公开素材，撤回后不可申请新链接
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '302':
          description: 转到五分钟S3签名链接
          headers:
            Location:
              schema:
                type: string
                format: uri
            Cache-Control:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
      description: 只有当前有效已发布轮播或媒体绑定的资产可读取；原稿附件、未审核会员视频、草稿和下架目录不自动公开。已经取得的签名URL在最长五分钟内仍有效。
  /search:
    get:
      operationId: searchPublicContent
      summary: 检索九类已发布公开内容，独立于用户工作区
      description: 标题、摘要和正文全文检索；私人记录、原附件和评审材料排除。分类counts遵循关键词/地区/语言，但不受kind限制。地区匹配当前地区与all共享内容。索引同步期间503
        SEARCH_UPDATING，故障503 SEARCH_UNAVAILABLE；旧游标409 SEARCH_CHANGED后从首页重试。无Mock回退。
      security: []
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
          default: ''
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - all
          - work
          - news
          - classic
          - activity
          - course
          - video
          - hall
          - product
          - venue
          default: all
      - name: region
        in: query
        schema:
          type: string
          default: all
      - name: language
        in: query
        schema:
          type: string
          enum:
          - zh
          - en
          default: zh
      - name: cursor
        in: query
        schema:
          type: string
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 12
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        default:
          $ref: '#/components/responses/Error'
  /admin/search/status:
    get:
      operationId: searchStatus
      summary: 区域/全国运营查看搜索状态；不含任何个人内容
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchStatus'
        default:
          $ref: '#/components/responses/Error'
  /admin/search/rebuild:
    post:
      operationId: rebuildSearch
      summary: 仅全国管理员请求从MySQL重新生成公开索引
      description: 原始业务数据不变；异步构建新索引，追平后原子切换。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  status:
                    type: string
                    enum:
                    - queued
        default:
          $ref: '#/components/responses/Error'
  /admin/accounts:
    get:
      summary: List scoped accounts
      security:
      - bearerAuth: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
          default: ''
      - name: role
        in: query
        required: false
        schema:
          type: string
          enum:
          - national_admin
          - regional_admin
          - content_operator
          - review_manager
          - data_operator
          - expert
          - member
      - name: region
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - enabled
          - disabled
          - pending
          - approved
          - rejected
          - returned
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialAccountPage'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors.
            401 authentication, 403 permission, 404 scope/owner/unknown, 409 business
            conflict, 412 stale version, 422 validation, 428 missing version.'
      description: Scope is independent from job role. Non-national operators can
        only see target accounts whose entire region set is contained in their scope,
        and cannot see national administrators.
      x-permissions:
      - users:read
    post:
      summary: Create an account through RuoYi user service
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CredentialIdempotencyKey'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMutationResult'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors.
            401 authentication, 403 permission, 404 scope/owner/unknown, 409 business
            conflict, 412 stale version, 422 validation, 428 missing version.'
      description: Requires national_admin as well as permission. New expert grants
        require completed manual material review, so create as another role first.
        Role bindings reuse sys_user_role; permissions use sys_role_menu. No external
        identity verification is claimed.
      x-permissions:
      - users:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialAccountCreate'
  /admin/accounts/{id}:
    get:
      summary: Read account and permitted manual review history
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialManagedAccount'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors.
            401 authentication, 403 permission, 404 scope/owner/unknown, 409 business
            conflict, 412 stale version, 422 validation, 428 missing version.'
      description: reviews is empty without users:review permission. Scope applies.
      x-permissions:
      - users:read
  /admin/accounts/{id}/{action}:
    post:
      summary: Change role, status, password or manual review record
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
          - roles
          - status
          - resetPassword
          - materials
          - review
      - $ref: '#/components/parameters/CredentialIdempotencyKey'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMutationResult'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors.
            401 authentication, 403 permission, 404 scope/owner/unknown, 409 business
            conflict, 412 stale version, 422 validation, 428 missing version.'
      description: roles requires users:roles and national_admin, with roles+regionIds;
        status requires users:status and enabled; resetPassword requires users:resetPassword
        and national_admin, with password. materials/review require users:review and
        subject+summary; materials additionally requires materialReference; review
        requires result and prior submitted material. Materials and decisions append
        immutable history and do not automatically grant expert role. Self roles/status/resetPassword/review
        are refused. Every action requires current version. Role/status/reset changes
        advance authEpoch; old sessions are rejected immediately on next authenticated
        request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialAccountAction'
  /rights/agreement:
    get:
      summary: Current submission confirmation terms
      security: []
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialAgreement'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors.
            401 authentication, 403 permission, 404 scope/owner/unknown, 409 business
            conflict, 412 stale version, 422 validation, 428 missing version.'
      description: Versioned checkbox terms, not an electronic signature or copyright
        registration.
  /me/copyright-confirmations:
    get:
      summary: Own explicit copyright confirmations
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialCopyrightHistory'
        default:
          description: 'API error: code, message, requestId; may include fieldErrors.
