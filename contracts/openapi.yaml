        '200':
          description: Saved own result; course.progress returns progress
          result.score/passed and publicationVersion: null
        '409':
          description: Missing versioned publication
          unread lessons or conflicting idempotency input: null
        '412':
          description: Optimistic version conflict
        '422':
          description: Invalid lesson
          answers or confirmation: null
