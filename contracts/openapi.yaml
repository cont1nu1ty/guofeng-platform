openapi: 3.0.3
info:
  title: 家风中华行本机真实业务接口
  version: 1.1.0-local
  description: 已实现的HTTP契约。采用若依Sa-Token会话，家风模块返回直接DTO；原生若依系统接口保留但不作为本契约。单库服务端地区/归属/任务授权。开发账号仅开发配置启用；微信、模型推理、支付、电子签章与全国容量未交付。数据库保存业务ID、S3对象键和版本；公开发布、处理状态、最终结果独立。
servers:
- url: http://127.0.0.1:18080/api/v1
  description: 默认Compose入口；局域网需修改绑定与S3公共端点
security:
- bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      summary: 数据库迁移完成后的就绪检查
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    enum:
                    - ok
                    type: string
                  schemaVersion:
                    type: integer
        default:
          $ref: '#/components/responses/Error'
        '503':
          description: 初始化未完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - {}
      - bearerAuth: []
  /auth/login:
    post:
      operationId: login
      summary: 开发账号登录（仅开发配置启用）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                client:
                  type: string
                  enum:
                  - admin
                  - member
              required:
              - username
              - password
              - client
      security:
      - {}
      - bearerAuth: []
  /auth/me:
    get:
      operationId: currentUser
      summary: 当前会话及最新授权
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      summary: 退出当前会话
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        default:
          $ref: '#/components/responses/Error'
  /auth/wechat:
    post:
      operationId: wechatAdapter
      summary: 微信登录适配入口，尚未启用
      security: []
      responses:
        '503':
          description: WECHAT_NOT_CONFIGURED；未执行code交换
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /workspace:
    get:
      operationId: memberWorkspace
      summary: 公开内容及当前账号本人数据
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberWorkspace'
        default:
          $ref: '#/components/responses/Error'
      security:
      - {}
      - bearerAuth: []
      description: 未登录只返回已发布公开内容。带有效会话时额外返回本人稿件、消息、报名和学习记录；专家仅取得分配给自己的脱敏材料。草稿、下架内容及其他用户私有数据不可见。列表暂为本机规模完整集合，没有分页或容量承诺。
  /admin/workspace:
    get:
      operationId: adminWorkspace
      summary: 按岗位和地区裁剪的后台工作区
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorkspace'
        default:
          $ref: '#/components/responses/Error'
      description: 区域筛选由客户端在已授权集合上缩小；接口不接受扩大权限的region参数。专家只取得本人任务和脱敏材料。后台原有13页共享一次聚合读取。
  /me/draft:
    get:
      operationId: getDraft
      summary: 本人草稿及ETag
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEnvelope'
          headers:
            ETag:
              schema:
                type: string
              description: 带双引号的槽版本；即使draft=null也有版本，如 "0"。
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: saveDraft
      summary: 条件保存本人草稿
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEnvelope'
          headers:
            ETag:
              schema:
                type: string
              description: 带双引号的槽版本；即使draft=null也有版本，如 "0"。
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionInput'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
    delete:
      operationId: clearDraft
      summary: 确认提交成功后条件清除编辑状态
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEnvelope'
          headers:
            ETag:
              schema:
                type: string
              description: 带双引号的槽版本；即使draft=null也有版本，如 "0"。
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
  /files:
    post:
      operationId: uploadFile
      summary: multipart上传到私有S3，返回永久fileId
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      description: 默认每文件1字节至10MiB，PNG/JPEG/PDF/DOC/DOCX；purpose=media接受MP4/MP3/WAV≤50MiB及图片≤10MiB。校验扩展名和文件头，DOCX验证容器结构。只接受已登录账号；失败不产生可提交的fileId。不属于病毒扫描、媒体解码兼容或文档内容安全鉴定。小程序通过uni.uploadFile。
      parameters:
      - name: purpose
        in: query
        schema:
          type: string
          enum:
          - manuscript
          - media
        description: 省略或manuscript：原图/PDF/Word限制10MiB；media：MP4/MP3/WAV≤50MiB，图片≤10MiB。后端校验实际文件头；不能把媒体绑定为稿件附件。
  /files/{id}/download:
    get:
      operationId: downloadFile
      summary: 校验附件业务权限后签发五分钟URL
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  expiresIn:
                    type: integer
                    enum:
                    - 300
                  name:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      description: 本人或获准地区运营读取关联稿件；专家不能取得原始附件。数据库不存签名地址。URL在有效期内为持有者凭据。
  /files/{id}/url:
    get:
      operationId: downloadFileAlias
      summary: 校验附件业务权限后签发五分钟URL
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  expiresIn:
                    type: integer
                    enum:
                    - 300
                  name:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      description: 本人或获准地区运营读取关联稿件；专家不能取得原始附件。数据库不存签名地址。URL在有效期内为持有者凭据。
  /submissions:
    post:
      operationId: submitWork
      summary: 受理新稿并生成不可变版本
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionInput'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /submissions/{id}/revisions:
    post:
      operationId: reviseWork
      summary: 退修重投：保留作品ID、新增版本、回到初审
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionInput'
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /submissions/{id}/progress:
    get:
      operationId: workProgress
      summary: 本人或获准运营读取进度及历史版本
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  work:
                    $ref: '#/components/schemas/Work'
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Revision'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
  /commands:
    post:
      operationId: memberCommand
      summary: 执行本人业务动作
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    additionalProperties: true
                  workspace:
                    $ref: '#/components/schemas/MemberWorkspace'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCommand'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /admin/commands:
    post:
      operationId: adminCommand
      summary: 执行授权后台业务动作
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    additionalProperties: true
                  workspace:
                    $ref: '#/components/schemas/AdminWorkspace'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommand'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      description: 写入在数据库事务内执行。更新已有记录必须携带workspace.lockVersion；batchApproveSubmissions使用data.versions。首次请求需幂等键，同键同载荷重放结果，工作区按当前权限重新投影；同键不同载荷409。认证、权限、校验失败不会演示回退。
  /files/{id}/public:
    get:
      operationId: publishedAsset
      summary: 已发布目录引用的公开素材，撤回后不可申请新链接
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '302':
          description: 转到五分钟S3签名链接
          headers:
            Location:
              schema:
                type: string
                format: uri
            Cache-Control:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
      description: 只有当前有效已发布轮播或媒体绑定的资产可读取；原稿附件、未审核会员视频、草稿和下架目录不自动公开。已经取得的签名URL在最长五分钟内仍有效。
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      example: '"3"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: 同一逻辑操作失败重试保持相同键；新的操作必须换键。
  responses:
    Error:
      description: 400请求格式；401会话；403岗位；404不可见；409业务/幂等冲突；412版本冲突；413文件大小；422校验；428缺版本/幂等键；429登录限流；500内部错误；503未启用适配。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
      required:
      - code
      - message
      - requestId
    ActionResult:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - member
            - expert
            - regional_admin
            - national_admin
        regionIds:
          type: array
          items:
            $ref: '#/components/schemas/RegionId'
        permissions:
          type: array
          items:
            type: string
        version:
          type: integer
      required:
      - id
      - name
      - roles
      - regionIds
      - permissions
      - version
    RegionId:
      type: string
      enum:
      - all
      - beijing
      - tianjin
      - hebei
      - shanxi
      - inner-mongolia
      - liaoning
      - jilin
      - heilongjiang
      - shanghai
      - jiangsu
      - zhejiang
      - anhui
      - fujian
      - jiangxi
      - shandong
      - henan
      - hubei
      - hunan
      - guangdong
      - guangxi
      - hainan
      - chongqing
      - sichuan
      - guizhou
      - yunnan
      - xizang
      - shaanxi
      - gansu
      - qinghai
      - ningxia
      - xinjiang
      - hong-kong
      - macao
      - taiwan
      - overseas
    File:
      type: object
      properties:
        fileId:
          type: string
        id:
          type: string
        name:
          type: string
        size:
          type: integer
        type:
          type: string
          enum:
          - image
          - word
          - pdf
        mimeType:
          type: string
      required:
      - fileId
      - id
      - name
      - size
      - type
      - mimeType
    SubmissionInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 50
        author:
          type: string
          maxLength: 100
        content:
          type: string
          maxLength: 10000
        contentDelta:
          type: object
          description: 仅文本insert与bold/italic/underline/header(2,3)/list(ordered,bullet)，纯文本须与content一致。
        region:
          $ref: '#/components/schemas/RegionId'
        genre:
          type: string
          enum:
          - letter
          - essay
          - poetry
          - memoir
          - biography
          - family-rules
          - family-notes
          - commentary
        channel:
          type: string
          enum:
          - public-service
          - school
          - community
          - special
        themes:
          type: array
          maxItems: 3
          items:
            type: string
            enum:
            - integrity
            - filial
            - neighbor
            - patriotism
            - heritage
            - family-history
        copyrightAccepted:
          type: boolean
        overseasLocation:
          type: string
        attachments:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              fileId:
                type: string
              id:
                type: string
        editingWorkId:
          type: string
      required:
      - title
      - content
      - region
      - genre
      - channel
      - themes
      - copyrightAccepted
      - attachments
    DraftEnvelope:
      type: object
      properties:
        draft:
          allOf:
          - $ref: '#/components/schemas/SubmissionInput'
          nullable: true
      required:
      - draft
    Work:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        content:
          type: string
        contentDelta:
          type: object
        region:
          $ref: '#/components/schemas/RegionId'
        version:
          type: integer
        lockVersion:
          type: integer
        revisionNumber:
          type: integer
        status:
          type: string
          enum:
          - pending_initial_review
          - in_review
          - returned
          - shortlisted
          - rejected
          - awarded
          - collected
        published:
          type: boolean
        isMine:
          type: boolean
        isDemo:
          type: boolean
          enum:
          - false
        submittedAt:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/File'
        reviews:
          type: array
          items:
            type: object
        history:
          type: array
          items:
            type: object
      required:
      - id
      - title
      - content
      - region
      - version
      - status
      - published
      - isMine
      - isDemo
    Revision:
      type: object
      properties:
        id:
          type: string
        revisionNumber:
          type: integer
        content:
          $ref: '#/components/schemas/SubmissionInput'
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - revisionNumber
      - content
      - createdAt
    Entity:
      type: object
      description: 各业务DTO的稳定元信息；新增业务字段由domain适配层处理，页面不解析若依原生响应。
      properties:
        id:
          type: string
        regionId:
          $ref: '#/components/schemas/RegionId'
        region:
          type: string
          description: 后台展示名称；不是授权来源
        status:
          type: string
        lockVersion:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    Dimension:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        min:
          type: integer
        max:
          type: integer
          enum:
          - 15
          - 25
          - 30
    ReviewTask:
      type: object
      properties:
        id:
          type: string
        submissionId:
          type: string
        version:
          type: integer
        ruleVersion:
          type: string
          enum:
          - jiafeng-four-v1
        status:
          type: string
          enum:
          - pending
          - submitted
        title:
          type: string
        content:
          type: string
          description: 经运营确认的脱敏正文
        dueAt:
          type: string
          format: date-time
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/Dimension'
        scores:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: integer
        comment:
          type: string
    MemberWorkspace:
      type: object
      properties:
        reviewRuleVersion:
          type: string
          description: 当前公示量表版本；实例任务另行冻结所属版本。
        scoringDimensions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              min:
                type: integer
              max:
                type: integer
        classics:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        news:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        courses:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        products:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        registrations:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        commerceRequests:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        excerpts:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        aiArchives:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        works:
          type: array
          items:
            $ref: '#/components/schemas/Work'
        reviewTasks:
          type: array
          items:
            $ref: '#/components/schemas/ReviewTask'
        favorites:
          type: array
          items:
            type: string
        mediaFavorites:
          type: array
          items:
            type: string
        mediaLikes:
          type: array
          items:
            type: string
        learning:
          type: object
          properties:
            courses:
              type: object
              additionalProperties:
                type: object
                properties:
                  lessons:
                    type: array
                    items:
                      type: string
                  quizPassed:
                    type: boolean
                  completedAt:
                    type: string
                    format: date-time
            checkIns:
              type: object
              additionalProperties:
                type: string
        platformConfig:
          type: object
        banners:
          type: array
          items:
