  /admin/education/commands:
    post:
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/EducationIdempotencyKey'
      description: Requires education:write before idempotency lookup; entity-region
        scope and optimistic version are checked. saveCourse writes only a draft.
        publishCourse appends an immutable publication; unpublishCourse withdraws
        the course. toggleCourse preserves the legacy adapter. education.saveGroup
        uses name,region,courseId,publicationVersion,cadreOnly,declarationText,memberIds
        (max 500). A group's region and assigned course version cannot change. Cadre-only
        assignments require manually approved identity. education.reviewIdentity uses
        user entityId, identity version, status approved/rejected and reason (2+ characters);
        self-approval is disallowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EducationCommand'
      responses:
        '200':
          description: Saved result with stable id and resulting version
        '403':
          description: Missing education permission or region scope
        '412':
          description: Stale optimistic version
        '422':
          description: Invalid draft
          group membership or identity review: null
  /media/{id}/accessibility:
    get:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      description: Only separately published manual captions/narration for a currently
        published media item. Replacing its source file hides old captions until republished.
        Draft fields and file IDs are never public. narrationUrl is a short-lived
        signed URL.
      responses:
        '200':
          description: Published captions and optional narration
          content:
            application/json:
              schema:
                type: object
                properties:
                  language:
                    type: string
                    enum:
                    - zh
                    - en
                  cues:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaCaptionCue'
                  narrationUrl:
                    type: string
                  publishedAt:
                    type: string
                    format: date-time
        '404':
          description: Main media not published
      security:
      - {}
      - bearerAuth: []
  /admin/media/{id}/accessibility:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      security:
      - bearerAuth: []
      description: content:read plus current parent media's region scope
      responses:
        '200':
          description: '{mediaId,version,draft:{language,cues,narrationFileId},publishedAt};
            version 0 means no draft yet'
    post:
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/EducationIdempotencyKey'
      description: content:write and current region scope are checked before idempotent
        replay. save validates ordered nonoverlapping cues and stores only draft.
        Newly linked narration must be the editor's uploaded media audio. publish
        copies saved draft and binds current sourceFileId; parent must be published.
        Unpublish immediately blocks new public lookups. Changes require current version,
        including initial version 0. Existing signed URLs expire separately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              - version
              properties:
                action:
                  type: string
                  enum:
                  - save
                  - publish
                  - unpublish
                version:
                  type: integer
                  minimum: 0
                data:
                  type: object
                  properties:
                    language:
                      type: string
                      enum:
                      - zh
                      - en
                    narrationFileId:
                      type: string
                      maxLength: 80
                    cues:
                      type: array
                      maxItems: 500
                      items:
                        $ref: '#/components/schemas/MediaCaptionCue'
      responses:
        '200':
          description: Updated administrator track DTO
        '409':
          description: Stale version
        '422':
          description: Invalid cues
          file ownership/type: null
          or unpublished main media: null
