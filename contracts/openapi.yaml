    BannerDraft:
      type: object
      properties:
        title: &id001
          type: string
        language: &id002
          type: string
          enum:
          - zh
          - en
        region: &id003
          type: string
          description: 稳定地区ID；区域运营只能使用已授权地区
        sortOrder: &id004
          type: integer
          minimum: 0
          maximum: 9999
        sample: &id005
          type: boolean
        category:
          type: string
          enum:
          - policy
          - contribution
          - celebration
          - collection
          - study
          - integrity
        subtitle:
          type: string
        description:
          type: string
        actionLabel:
          type: string
        footnote:
          type: string
        coverFileId:
          type: string
        targetScreen:
          type: string
          enum:
          - news
          - submit
          - library
          - learning
          - classroom
          - media
          - hall
          - venues
          - review
        targetId:
          type: string
          description: 可选关联业务ID；发布时验证公开状态与地区；目标下架后轮播自动隐藏
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      required:
      - title
      - language
      - region
    Banner:
      allOf:
      - $ref: '#/components/schemas/Entity'
      - $ref: '#/components/schemas/BannerDraft'
      description: 后台/本人记录。公开投影不包含所有者、文件ID和审核意见；媒体source/poster、轮播cover返回经发布权限校验的稳定资源链接。
