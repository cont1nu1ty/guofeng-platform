              schema:
                type: object
                properties:
                  courses:
                    type: array
                    items:
                      $ref: '#/components/schemas/EducationDraftCourse'
                  learningGroups:
                    type: array
                    items:
                      $ref: '#/components/schemas/EducationGroup'
