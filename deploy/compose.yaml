name: ${COMPOSE_PROJECT_NAME:-jiafeng-dev}
x-runtime: &runtime
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "5"
  security_opt: [no-new-privileges:true]
services:
  mysql:
    <<: *runtime
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 256
    image: mysql:8.4.9@sha256:c36050afdca850f23cef85703f84c7531a5ae155a11b5ee1c60acb09937c4084
    environment:
      MYSQL_DATABASE: jiafeng
      MYSQL_USER: jiafeng
      MYSQL_PASSWORD: ${DB_PASSWORD:?run ./deploy/dev up first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run ./deploy/dev up first}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/jiafeng.cnf:/etc/mysql/conf.d/jiafeng.cnf:ro
      - ../apps/server/script/sql/ry_vue.sql:/docker-entrypoint-initdb.d/01-ruoyi.sql:ro
      - ../apps/server/script/sql/ry_workflow.sql:/docker-entrypoint-initdb.d/02-workflow.sql:ro
      - ./mysql/99-disable-upstream-demo.sql:/docker-entrypoint-initdb.d/99-disable-upstream-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u jiafeng -D jiafeng -Nse 'SELECT completed FROM jf_bootstrap_ready WHERE id=1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 45s
    restart: unless-stopped
  redis:
    <<: *runtime
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    image: redis:8.6.3@sha256:4d25e2fe601f7ffaeb4437cb6ced3518bc36edf34ebe98863c80836943d94529
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run ./deploy/dev up first}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  storage:
    <<: *runtime
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command: ["mini", "-dir=/data", "-ip=storage", "-ip.bind=0.0.0.0", "-bucket=jiafeng-private", "-s3.config=/config/s3.json", "-s3.port.iceberg=0", "-s3.port.lance=0", "-s3.autoCreateBucket=false", "-s3.allowDeleteBucketNotEmpty=false", "-s3.iam=false", "-admin.ui=false", "-webdav=false", "-master.telemetry=false", "-volume.max=8"]
    ports:
      - "${JIAFENG_BIND_ADDRESS:-127.0.0.1}:${JIAFENG_S3_PORT:-18333}:8333"
    volumes:
      - storage-data:/data
      - ${JIAFENG_LOCAL_CONFIG:-./.local}/s3.json:/config/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  server:
    <<: *runtime
    stop_grace_period: 45s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    volumes:
      - server-logs:/app/logs
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: ${JIAFENG_SERVER_IMAGE:-jiafeng-server:local}
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: jiafeng
      DB_USERNAME: jiafeng
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JIAFENG_HEALTH_PASSWORD: ${JIAFENG_HEALTH_PASSWORD}
      JIAFENG_TOKEN_SECRET: ${JIAFENG_TOKEN_SECRET}
      JIAFENG_DEV_ACCOUNTS_ENABLED: ${JIAFENG_DEV_ACCOUNTS_ENABLED:-true}
      JIAFENG_DEV_PASSWORD: ${JIAFENG_DEV_PASSWORD}
      JIAFENG_PUBLIC_CACHE_ENABLED: ${JIAFENG_PUBLIC_CACHE_ENABLED:-true}
      JIAFENG_PUBLIC_CACHE_NAMESPACE: ${COMPOSE_PROJECT_NAME:-jiafeng-dev}
      JIAFENG_S3_ENDPOINT: http://storage:8333
      JIAFENG_S3_PUBLIC_ENDPOINT: ${JIAFENG_S3_PUBLIC_ENDPOINT:-http://127.0.0.1:18333}
      JIAFENG_S3_PUBLIC_IPV6_ENDPOINT: ${JIAFENG_S3_PUBLIC_IPV6_ENDPOINT:-}
      JIAFENG_S3_ACCESS_KEY: ${JIAFENG_S3_ACCESS_KEY}
      JIAFENG_S3_SECRET_KEY: ${JIAFENG_S3_SECRET_KEY}
      JIAFENG_S3_BUCKET: jiafeng-private
      JIAFENG_SEARCH_ENDPOINT: http://search:9200
      JIAFENG_SEARCH_USERNAME: elastic
      JIAFENG_SEARCH_PASSWORD: ${JIAFENG_SEARCH_PASSWORD:?run ./deploy/dev init first}
      JIAFENG_AI_ENDPOINT: http://ai:8090
      JIAFENG_AI_SERVICE_KEY: ${JIAFENG_AI_SERVICE_KEY:?run ./deploy/dev init first}
      TZ: Asia/Shanghai
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage: {condition: service_healthy}
      search: {condition: service_healthy}
      ai: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/v1/health | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
  ai:
    <<: *runtime
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ai
    image: ${JIAFENG_AI_IMAGE:-jiafeng-ai:local}
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      JIAFENG_AI_SERVICE_KEY: ${JIAFENG_AI_SERVICE_KEY}
      JIAFENG_AI_ENABLED: ${JIAFENG_AI_ENABLED:-false}
      JIAFENG_AI_PROVIDER: ${JIAFENG_AI_PROVIDER:-openai-compatible}
      JIAFENG_AI_EXTERNAL: ${JIAFENG_AI_EXTERNAL:-false}
      JIAFENG_AI_BASE_URL: ${JIAFENG_AI_BASE_URL:-}
      JIAFENG_AI_MODEL: ${JIAFENG_AI_MODEL:-}
      JIAFENG_AI_API_KEY: ${JIAFENG_AI_API_KEY:-}
      JIAFENG_AI_OCR_BASE_URL: ${JIAFENG_AI_OCR_BASE_URL:-${JIAFENG_AI_BASE_URL:-}}
      JIAFENG_AI_OCR_API_KEY: ${JIAFENG_AI_OCR_API_KEY:-${JIAFENG_AI_API_KEY:-}}
      JIAFENG_AI_OCR_MODEL: ${JIAFENG_AI_OCR_MODEL:-}
      JIAFENG_AI_OCR_PROTOCOL: ${JIAFENG_AI_OCR_PROTOCOL:-layout}
      JIAFENG_AI_TIMEOUT_SECONDS: ${JIAFENG_AI_TIMEOUT_SECONDS:-110}
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  search:
    <<: *runtime
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4@sha256:82ac14f43fe701992e601f4cc81e1c0d7dbc5a2576d8cd736006452925df4026
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    environment:
      discovery.type: single-node
      cluster.name: jiafeng-search
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      ELASTIC_PASSWORD: ${JIAFENG_SEARCH_PASSWORD:?run ./deploy/dev init first}
    volumes:
      - search-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --user elastic:$$ELASTIC_PASSWORD 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=3s' | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
  web:
    <<: *runtime
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 128
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: ${JIAFENG_WEB_IMAGE:-jiafeng-web:local}
    ports:
      - "${JIAFENG_BIND_ADDRESS:-127.0.0.1}:${JIAFENG_HTTP_PORT:-18080}:80"
    depends_on:
      server: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  mysql-data:
    name: ${COMPOSE_PROJECT_NAME:-jiafeng-dev}_mysql-data-v1
  redis-data:
  storage-data:
  search-data:
  server-logs:
