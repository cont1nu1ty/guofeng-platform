server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 52m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location /api/v1/ {
    proxy_pass http://server:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
  }
  location ~ ^/(auth|system|resource|workflow|warm-flow)(/|$) {
    proxy_pass http://server:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location = /admin { return 308 /admin/; }
  location /admin/ { try_files $uri $uri/ /admin/index.html; }
  location / { try_files $uri $uri/ /index.html; }
}
